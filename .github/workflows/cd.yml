name: CD Pipeline

# Purpose: Ship builds to stores/TestFlight/etc.
# Typical steps: Sign, upload IPA/AAB, deploy
# When: Merge to main, tags, manual approval
# Risk: High (publishes artifacts)

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: Deploy flavor
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod
      upload:
        description: Upload to stores (requires signing secrets)
        required: true
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.x'

jobs:
  resolve-config:
    name: Resolve Deploy Config
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      flavor: ${{ steps.config.outputs.flavor }}
      upload: ${{ steps.config.outputs.upload }}
      sha: ${{ steps.config.outputs.sha }}
    steps:
      - name: Resolve flavor and upload mode
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "flavor=${{ github.event.inputs.flavor }}" >> "$GITHUB_OUTPUT"
            echo "upload=${{ github.event.inputs.upload }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-google-play:
    name: Google Play
    runs-on: ubuntu-latest
    needs: [resolve-config]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-config.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: chmod +x ./scripts/ci/setup_environment.sh ./scripts/deploy/deploy_playstore.sh ./scripts/build/build_android.sh ./scripts/build/_common.sh
      - run: ./scripts/ci/setup_environment.sh

      - name: Build App Bundle
        run: ./scripts/deploy/deploy_playstore.sh -f "${{ needs.resolve-config.outputs.flavor }}"

      - name: Upload to Google Play
        if: needs.resolve-config.outputs.upload == 'true'
        run: ./scripts/deploy/deploy_playstore.sh -f "${{ needs.resolve-config.outputs.flavor }}" --no-build --upload --track internal
        env:
          SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
          SUPPLY_PACKAGE_NAME: ${{ secrets.SUPPLY_PACKAGE_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: play-aab-${{ needs.resolve-config.outputs.flavor }}
          path: build/app/outputs/bundle/

  deploy-app-store:
    name: App Store Connect
    runs-on: macos-latest
    needs: [resolve-config]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-config.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: chmod +x ./scripts/ci/setup_environment.sh ./scripts/deploy/deploy_appstore.sh ./scripts/build/build_ios.sh ./scripts/build/_common.sh
      - run: ./scripts/ci/setup_environment.sh

      - name: Build iOS
        if: needs.resolve-config.outputs.upload != 'true'
        run: ./scripts/build/build_ios.sh -f "${{ needs.resolve-config.outputs.flavor }}" --skip-analyze --skip-test --skip-pod-install

      - name: Build and archive IPA
        if: needs.resolve-config.outputs.upload == 'true'
        run: ./scripts/deploy/deploy_appstore.sh -f "${{ needs.resolve-config.outputs.flavor }}"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload to App Store Connect
        if: needs.resolve-config.outputs.upload == 'true'
        run: ./scripts/deploy/deploy_appstore.sh -f "${{ needs.resolve-config.outputs.flavor }}" --no-build --upload
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ needs.resolve-config.outputs.flavor }}
          path: build/ios/
